<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이시가키 여행 플래너</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 48'%3E%3Cpath fill='%233f7f8c' d='M32 11c3 0 5 1.4 7.2 3.4C47 14.6 57 17 62 23c-8 1.4-17 4.6-25.4 11h-9.2C19 27.6 10 24.4 2 23c5-6 15-8.4 22.8-8.6C27 12.4 29 11 32 11z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 3.1 Header -->
  <header class="header">
    <div class="header__inner">
      <div class="header__brand">
        <span class="logo">
          <svg viewBox="0 0 64 48" aria-hidden="true">
            <defs>
              <linearGradient id="mantaFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4f8f9c" />
                <stop offset="1" stop-color="#2f5f6e" />
              </linearGradient>
            </defs>
            <path fill="url(#mantaFill)" d="M32 11c3 0 5 1.4 7.2 3.4C47 14.6 57 17 62 23c-8 1.4-17 4.6-25.4 11h-9.2C19 27.6 10 24.4 2 23c5-6 15-8.4 22.8-8.6C27 12.4 29 11 32 11z" />
            <path fill="#2f5f6e" d="M27.6 13.2c-2.4-2.6-2.6-6-.8-8.6.6 2.8 2 5 3.8 6.8zM36.4 13.2c2.4-2.6 2.6-6 .8-8.6-.6 2.8-2 5-3.8 6.8z" />
            <path fill="none" stroke="#2f5f6e" stroke-width="1.4" stroke-linecap="round" d="M32 33.5c0 5-.6 9-2.4 13" />
            <path fill="#ffffff" opacity=".35" d="M32 16c4 0 7 2.6 7 7.4 0 3.4-3 6.6-7 8.6-4-2-7-5.2-7-8.6C25 18.6 28 16 32 16z" />
          </svg>
        </span>
        <div>
          <h1 id="tripTitle" class="header__title">여행 제목</h1>
          <p id="tripPeriod" class="header__period">기간</p>
        </div>
      </div>
      <div class="header__actions">
        <button type="button" id="btnSummary" class="btn btn--ghost">전체 일정 요약</button>
        <button type="button" id="btnReset" class="btn btn--ghost">샘플 데이터 불러오기</button>
      </div>
    </div>
    <svg class="header__waves" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path class="wave wave--back" d="M0 46c120-22 240-30 360-14s240 40 360 32 240-38 360-40 240 22 360 30v36H0z" />
      <path class="wave wave--mid" d="M0 60c160-20 300-12 440 6s280 22 420 4 300-30 420-18 120 12 160 14v24H0z" />
      <path class="wave wave--front" d="M0 74c180-14 360-8 540 4s360 10 540-2 280-12 360-6v20H0z" />
    </svg>
  </header>

  <!-- 3.2 Day Tabs -->
  <nav class="tabs" aria-label="여행 일자">
    <div id="dayTabs" class="tabs__list" role="tablist"></div>
    <button type="button" id="btnAddDay" class="tabs__add">+ 일자 추가</button>
  </nav>

  <main class="main">
    <!-- 3.3 Timeline -->
    <section class="timeline" aria-labelledby="dayHeading">
      <div class="timeline__head">
        <h2 id="dayHeading">Day 1</h2>
        <p id="dayStats" class="timeline__stats"></p>
      </div>
      <ol id="timelineList" class="timeline__list"></ol>
      <div id="emptyState" class="empty" hidden>
        <p>등록된 일정이 없습니다. 새 일정을 추가해보세요!</p>
      </div>
    </section>

    <!-- 3.4 Form (desktop: 우측 패널 / mobile: 바텀 시트) -->
    <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
    <aside id="formPanel" class="form-panel" aria-labelledby="formTitle">
      <div class="form-panel__head">
        <h2 id="formTitle">신규 일정 등록</h2>
        <button type="button" id="btnCloseSheet" class="icon-btn sheet-only" aria-label="닫기">✕</button>
      </div>
      <form id="scheduleForm" novalidate>
        <input type="hidden" id="fId" />
        <label class="field">
          <span class="field__label">시간</span>
          <input type="time" id="fTime" required value="09:00" />
        </label>
        <label class="field">
          <span class="field__label">장소/활동명 <em class="req">*</em></span>
          <input type="text" id="fTitle" maxlength="60" placeholder="예: 가비라 만 글라스보트" />
          <span id="titleError" class="field__error" hidden>장소/활동명을 입력해야 등록할 수 있습니다.</span>
        </label>
        <fieldset class="field">
          <legend class="field__label">카테고리</legend>
          <div id="fCategory" class="badges" role="radiogroup"></div>
        </fieldset>
        <label class="field">
          <span class="field__label">비용 (선택, 엔 ¥)</span>
          <input type="number" id="fCost" min="0" step="100" inputmode="numeric" placeholder="예: 15000" />
        </label>
        <label class="field">
          <span class="field__label">메모 (선택) <span id="memoCount" class="counter">0/100</span></span>
          <textarea id="fMemo" maxlength="100" rows="3" placeholder="간단한 한 줄 설명"></textarea>
        </label>
        <div class="form-actions">
          <button type="button" id="btnCancelEdit" class="btn btn--ghost" hidden>취소</button>
          <button type="submit" id="btnSubmit" class="btn btn--primary">일정 등록</button>
        </div>
      </form>
    </aside>
  </main>

  <button type="button" id="btnFab" class="fab" aria-label="일정 추가">+ 일정 추가</button>

  <!-- 전체 일정 요약 -->
  <dialog id="summaryDialog" class="dialog">
    <div class="dialog__head">
      <h2>전체 일정 요약</h2>
      <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
    </div>
    <div id="summaryBody" class="dialog__body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
